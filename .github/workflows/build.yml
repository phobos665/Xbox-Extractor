name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The Tauri crate needs WebKitGTK on Linux; the libraries and CLI do not.
      - run: cargo test -p xbe -p xib-core -p xib-cli

  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One app for Apple Silicon and Intel.
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: --bundles dmg
          # No installer: the plain .exe and its sidecar, as release.yml ships them.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundle: --no-bundle
    runs-on: ${{ matrix.os }}
    env:
      # Read by app/scripts/build-sidecar.mjs so extract-xiso is built for the same target.
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.bundle }}
        working-directory: app
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item target/${{ matrix.target }}/release/xbox-iso-batcher.exe portable/
          Copy-Item app/src-tauri/binaries/extract-xiso-${{ matrix.target }}.exe portable/extract-xiso.exe
      # upload-artifact zips what it is given, so the Windows artifact is already the portable zip.
      - uses: actions/upload-artifact@v4
        with:
          name: xbox-iso-batcher-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            portable/
