[workspace]
resolver = "2"
members = ["crates/xbe", "crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Daniel Joyce"]
repository = "https://github.com/phobos665/Xbox-Extractor"

[workspace.dependencies]
xbe = { path = "crates/xbe" }
xib-core = { path = "crates/core" }
xdvdfs = "0.8.3"
suppaftp = { version = "12.1.1", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
png = "0.17"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
