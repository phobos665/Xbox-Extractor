[package]
name = "xbox-iso-batcher"
description = "List the titles on an original Xbox over FTP and stream them into ISOs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which Windows needs
# (https://github.com/rust-lang/cargo/issues/8519).
name = "xbox_iso_batcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
xib-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
env_logger = "0.11"
tauri-plugin-shell = "2"
